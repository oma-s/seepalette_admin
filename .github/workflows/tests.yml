name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COVERAGE_RETENTION_DAYS: 3

jobs:
  build_image:
    name: Build production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag seepalette-admin:test .

  run_tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Run tests
        env:
          COVERAGE: true
          RAILS_ENV: test
        run: bin/rails db:test:prepare test:all
      - name: Run RSpec
        env:
          RAILS_ENV: test
        run: bundle exec rspec
      - name: Check autoloading
        run: bin/rails zeitwerk:check
      - name: Check production assets
        env:
          APP_HOST: example.invalid
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: 1
          SKIP_BUN_INSTALL: 1
        run: bin/rails assets:precompile
      - name: Upload screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: rails-coverage
          path: coverage
          if-no-files-found: error
          retention-days: ${{ env.COVERAGE_RETENTION_DAYS }}
